[project]
name = "kuairand-agent"
version = "0.1.0"
description = "Autonomous ML research agent for the KuaiRand-Pure ranking benchmark"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",     # the only dependency the official starter kit needs
    "pandas>=2.2",     # agent-facing generated pipeline code
    "lightgbm>=4.3",   # default inner model: lambdarank (listwise, group=user), CPU-first
    "pyyaml>=6.0",     # configs
    "anthropic>=0.40", # LLM provider — used ONLY behind agent/llm.py
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
